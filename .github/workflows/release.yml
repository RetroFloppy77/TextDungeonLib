name: Publish Release to PyPI

on:
  push:
    tags:
      - 'v*' # Si attiva al push di un tag che inizia per 'v' (es. v1.0.0)

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # Necessario per i Trusted Publishers di PyPI

    steps:
      - name: Checkout del codice
        uses: actions/checkout@v4

      - name: Configurazione Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installazione strumenti di build
        run: |
          python -m pip install --upgrade pip
          pip install build

      - name: Compilazione del pacchetto (sdist e wheel)
        run: python -m build

      - name: Pubblicazione su PyPI
        uses: pypa/gh-action-pypi-publish@release/v1