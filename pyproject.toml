[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "textdungeonlib"
version = "1.0.0"
description = "Libreria leggera e modulare in Python per avventure testuali."
readme = "README.md"
authors = [
    { name = "Stefano Peris", email = "stefanoperis.github@gmail.com" }
]
license = { text = "MIT" }
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[tool.setuptools.packages.find]
include = ["textdungeonlib*"]